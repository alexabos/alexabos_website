bio:
  - I build and lead Data Science solutions at the intersection of AI, business and life sciences, working across commercial analytics, optimisation and pharmacokinetic modelling.
  - I currently work as a Lead Data Scientist at Sanofi. My PhD in Biomedical Engineering focused on MRI connectomics in movement disorders, including research experience at the University of Oxford, and my work has contributed to 25+ scientific publications and 2 patents.
  - Outside of industry projects, I work as Program Coordinator & Lecturer on the Master in Data Analytics for Business at UPF Barcelona School of Management.
