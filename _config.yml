  avatar: /static/assets/img/landing/avatar.jpg  # upload your avatar at directory and edit it.
  github_username: alexabos # Leave blank if you don't have now
  linkedin_id: alexandra-ab%C3%B3s-3167a994 # Leave blank if you don't have now
  facebook_username:  # Leave blank if you don't have now
  twitter_username:  # Leave blank if you don't have now
  email: alexandraabos@gmail.com  # Leave blank if you don't have now
  cv:   /static/assets/Alexandra_Abos_CV.pdf # local CV PDF, leave blank if you don't have now
