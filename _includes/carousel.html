<div id="inSlider" class="carousel slide carousel-fade" data-bs-ride="carousel">
    <ol class="carousel-indicators">
        <li data-bs-target="#inSlider" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></li>
        <li data-bs-target="#inSlider" data-bs-slide-to="1" aria-label="Slide 2"></li>
    </ol>
    <div class="carousel-inner" role="listbox">

        <div class="carousel-item item active">
            <div class="container">
                <div class="carousel-caption">
                </div>
                <div class="carousel-image wow zoomIn">
                    <!-- <img src="static/img/landing/laptop.png" alt="laptop"/> -->
                </div>
            </div>
            <!-- Set background for slide in css -->
            <div
            class="header-back"
            style="background-image: url({{ '/static/assets/img/' | prepend: site.baseurl }}{{ site.data.index.banners[0].src }});"
            title="{{ site.data.index.banners[0].title }}">
            </div>
        </div>

        {% for banner in site.data.index.banners offset:1 %}
        <div class="carousel-item item">
            <div class="container">
                <div class="carousel-caption">
                </div>
                <div class="carousel-image wow zoomIn">
                    <!-- <img src="static/img/landing/laptop.png" alt="laptop"/> -->
                </div>
            </div>
            <!-- Set background for slide in css -->
            <div class="header-back" style="background-image: url({{ "/static/assets/img/"  | prepend: site.baseurl }}{{ banner.src }});" title="{{ banner.title }}"></div>
        </div>
        {% endfor %}

    </div>
    <a class="left carousel-control carousel-control-prev" href="#inSlider" role="button" data-bs-slide="prev">
        <span class="fa fa-chevron-left" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </a>
    <a class="right carousel-control carousel-control-next" href="#inSlider" role="button" data-bs-slide="next">
        <span class="fa fa-chevron-right" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </a>
</div>
