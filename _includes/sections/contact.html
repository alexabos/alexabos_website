<div class="container" id="i18_contact">
    <div class="row m-b-lg">
        <div class="col-lg-12 text-center">
            <div class="navy-line"></div>
            <h1><span data-i18n="contact.contact">Contact</span></h1>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-8 col-lg-offset-2 text-center wow zoomIn">
            <p>Get in touch via LinkedIn or email.</p>
            <ul class="list-inline social-icon">
                {% if site.author.linkedin_id %}
                <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin_id }}" target="_blank" rel="noopener"><i class="fa fa-linkedin"></i></a></li>
                {% endif %}
                {% if site.author.email %}
                <li><a href="mailto:{{ site.author.email }}"><i class="fa fa-envelope-o"></i></a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</div>
